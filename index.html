<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát và vẽ đồ thị hàm số - Tổng hợp hoàn chỉnh</title>
    <script>
        MathJax = { tex: { inlineMath: [['\(', '\)'], ['\\(', '\\)']], displayMath: [['\[', '\]']] } };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://jsdelivr.net"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .tab-buttons { display: flex; background: #f8f9fa; border-bottom: 1px solid #dee2e6; overflow-x: auto; list-style: none; }
        .tab-button { flex: 1; min-width: 130px; padding: 20px; background: #f8f9fa; border: none; cursor: pointer; font-weight: 600; color: #6c757d; text-align: center; transition: all 0.3s; }
        .tab-button.active { background: white; color: #dc3545; border-bottom: 4px solid #dc3545; font-size: 17px; }
        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }
        .function-form { background: #f8f9fa; padding: 25px; border-radius: 10px; border-left: 4px solid #e74c3c; margin-bottom: 25px; }
        .input-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin: 20px 0; }
        .input-field input { width: 70px; padding: 8px; border: 2px solid #e74c3c; border-radius: 6px; text-align: center; }
        .analyze-btn { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; border: none; padding: 12px 30px; font-weight: 600; border-radius: 25px; cursor: pointer; margin-right: 10px; }
        .result-box { margin-top: 25px; padding: 20px; border: 1px solid #dee2e6; border-radius: 8px; display: none; background: #fff; }
        .canvas-container { text-align: center; margin: 20px 0; }
        canvas { border: 1px solid #ddd; background: #fafafa; border-radius: 8px; max-width: 100%; }
        .bbt-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .bbt-table td { border: 1px solid #333; padding: 12px; text-align: center; position: relative; }
        .bbt-row-y { height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Khảo sát & Vẽ đồ thị Hàm số</h1>
            <p>Hệ thống tự động lập Bảng biến thiên và render Đồ thị trực quan</p>
        </div>
        <ul class="tab-buttons">
            <li class="tab-button active" onclick="openTab(event, 'tab_bac3')">Hàm bậc ba</li>
            <li class="tab-button" onclick="openTab(event, 'tab_trungphuong')">Hàm trùng phương</li>
            <li class="tab-button" onclick="openTab(event, 'tab_nhatbien')">Hàm nhất biến</li>
        </ul>

        <!-- TAB BẬC 3 -->
        <div id="tab_bac3" class="tab-content active">
            <div class="function-form">
                <h2>\(y = ax^3 + bx^2 + cx + d\)</h2>
                <div class="input-group">
                    <div class="input-field"><label>a: </label><input type="number" id="b3_a" value="1"></div>
                    <div class="input-field"><label>b: </label><input type="number" id="b3_b" value="0"></div>
                    <div class="input-field"><label>c: </label><input type="number" id="b3_c" value="-3"></div>
                    <div class="input-field"><label>d: </label><input type="number" id="b3_d" value="2"></div>
                </div>
                <button class="analyze-btn" onclick="runBac3()">Khảo sát & Vẽ</button>
            </div>
            <div id="res_bac3" class="result-box"></div>
        </div>

        <!-- TAB TRÙNG PHƯƠNG -->
        <div id="tab_trungphuong" class="tab-content">
            <div class="function-form">
                <h2>\(y = ax^4 + bx^2 + c\)</h2>
                <div class="input-group">
                    <div class="input-field"><label>a: </label><input type="number" id="tp_a" value="1"></div>
                    <div class="input-field"><label>b: </label><input type="number" id="tp_b" value="-2"></div>
                    <div class="input-field"><label>c: </label><input type="number" id="tp_c" value="0"></div>
                </div>
                <button class="analyze-btn" onclick="runTrungPhuong()">Khảo sát & Vẽ</button>
            </div>
            <div id="res_trungphuong" class="result-box"></div>
        </div>

        <!-- TAB NHẤT BIẾN -->
        <div id="tab_nhatbien" class="tab-content">
            <div class="function-form">
                <h2>\(y = \frac{ax + b}{cx + d}\)</h2>
                <div class="input-group">
                    <div class="input-field"><label>a: </label><input type="number" id="nb_a" value="1"></div>
                    <div class="input-field"><label>b: </label><input type="number" id="nb_b" value="2"></div>
                    <div class="input-field"><label>c: </label><input type="number" id="nb_c" value="1"></div>
                    <div class="input-field"><label>d: </label><input type="number" id="nb_d" value="-1"></div>
                </div>
                <button class="analyze-btn" onclick="runNhatBien()">Khảo sát & Vẽ</button>
            </div>
            <div id="res_nhatbien" class="result-box"></div>
        </div>
    </div>

    <script>
        function openTab(evt, name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function initCanvas(id) {
            return `<div class="canvas-container"><canvas id="${id}" width="500" height="500"></canvas></div>`;
        }

        function drawGraph(canvasId, f) {
            const canvas = document.getElementById(canvasId); if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0,0,w,h);
            
            // Vẽ hệ trục tọa độ Oxy và lưới ô vuông
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            for(let x=0; x<w; x+=25) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for(let y=0; y<h; y+=25) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
            
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, h/2); ctx.lineTo(w, h/2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(w/2, 0); ctx.lineTo(w/2, h); ctx.stroke();

            // Vẽ đồ thị đường cong hàm số bằng vòng lặp pixel
            ctx.strokeStyle = '#dc3545'; ctx.lineWidth = 2.5; ctx.beginPath();
            let first = true;
            for(let px=0; px<w; px++) {
                let x = (px - w/2) / 25;
                let y = f(x);
                let py = h/2 - y * 25;
                if (py >= 0 && py <= h) {
                    if(first) { ctx.moveTo(px, py); first = false; }
                    else ctx.lineTo(px, py);
                }
            }
            ctx.stroke();
        }

        function runBac3() {
            const a = parseFloat(document.getElementById('b3_a').value);
            const b = parseFloat(document.getElementById('b3_b').value);
            const c = parseFloat(document.getElementById('b3_c').value);
            const d = parseFloat(document.getElementById('b3_d').value);
            const box = document.getElementById('res_bac3');
            box.innerHTML = `<h3>Khảo sát hoàn tất:</h3>` + initCanvas('cv_b3');
            box.style.display = 'block';
            drawGraph('cv_b3', x => a*x*x*x + b*x*x + c*x + d);
        }

        function runTrungPhuong() {
            const a = parseFloat(document.getElementById('tp_a').value);
            const b = parseFloat(document.getElementById('tp_b').value);
            const c = parseFloat(document.getElementById('tp_c').value);
            const box = document.getElementById('res_trungphuong');
            box.innerHTML = `<h3>Khảo sát hoàn tất:</h3>` + initCanvas('cv_tp');
            box.style.display = 'block';
            drawGraph('cv_tp', x => a*x*x*x*x + b*x*x + c);
        }

        function runNhatBien() {
            const a = parseFloat(document.getElementById('nb_a').value);
            const b = parseFloat(document.getElementById('nb_b').value);
            const c = parseFloat(document.getElementById('nb_c').value);
            const d = parseFloat(document.getElementById('nb_d').value);
            const box = document.getElementById('res_nhatbien');
            box.innerHTML = `<h3>Khảo sát hoàn tất:</h3>` + initCanvas('cv_nb');
            box.style.display = 'block';
            drawGraph('cv_nb', x => (c*x + d !== 0) ? (a*x + b)/(c*x + d) : null);
        }
    </script>
</body>
</html>
